version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: estudy_postgres_dev
    environment:
      POSTGRES_DB: estudy_dev
      POSTGRES_USER: estudy
      POSTGRES_PASSWORD: estudy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
